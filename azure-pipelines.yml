# Azure DevOps pipeline for the GCP Cloud Storage POC Terraform.
#
# Setup (once):
#   1. Create this GitHub repo, then in ADO: Pipelines → New pipeline → GitHub → this repo.
#   2. Create variable group "gcp-terraform-poc" (Pipelines → Library):
#        GCP_PROJECT_ID     - GCP project (e.g. freyr-ai)
#        GCP_BUCKET_NAME    - globally unique bucket name (e.g. freyr-ai-poc-storage)
#        GCP_SA_JSON        - service account JSON key (secret)
#        TF_STATE_BUCKET    - existing GCS bucket for Terraform state
#        TF_STATE_PREFIX    - object prefix, e.g. gcp/poc-storage
#   3. Create environment "gcp-poc" and add an approval check for apply/destroy.
#   4. Grant the service account roles/storage.admin (and serviceusage.serviceUsageAdmin
#      if the Storage API is not already enabled) on the project, plus objectAdmin on
#      the state bucket.
#
# Pull requests and CI on main: fmt, validate, plan (no apply).
# Manual run: choose plan, apply, or destroy. Apply/destroy require environment approval.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: terraformAction
    displayName: Terraform action (manual runs)
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

variables:
  - group: gcp-terraform-poc
  - name: TF_VERSION
    value: "1.11.4"
  - name: TF_IN_AUTOMATION
    value: "true"
  - name: TF_INPUT
    value: "0"
  - name: terraformActionEffective
    value: ${{ parameters.terraformAction }}

pool:
  vmImage: ubuntu-22.04

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        displayName: fmt and validate
        steps:
          - checkout: self
          - template: pipelines/install-terraform.yml
            parameters:
              version: $(TF_VERSION)
          - script: |
              set -euo pipefail
              terraform fmt -check -recursive -diff
              terraform init -input=false -backend=false
              terraform validate
            displayName: terraform fmt / validate
            env:
              TF_IN_AUTOMATION: $(TF_IN_AUTOMATION)

  - stage: Plan
    displayName: Plan
    dependsOn: Validate
    jobs:
      - job: Plan
        displayName: terraform plan
        steps:
          - checkout: self
          - template: pipelines/install-terraform.yml
            parameters:
              version: $(TF_VERSION)
          - script: |
              set -euo pipefail
              chmod +x pipelines/run-terraform.sh
              pipelines/run-terraform.sh plan
            displayName: terraform plan
            env:
              TF_IN_AUTOMATION: $(TF_IN_AUTOMATION)
              TF_INPUT: $(TF_INPUT)
              GOOGLE_CREDENTIALS: $(GCP_SA_JSON)
              GCP_PROJECT_ID: $(GCP_PROJECT_ID)
              GCP_BUCKET_NAME: $(GCP_BUCKET_NAME)
              TF_STATE_BUCKET: $(TF_STATE_BUCKET)
              TF_STATE_PREFIX: $(TF_STATE_PREFIX)
          - task: PublishPipelineArtifact@1
            displayName: Publish plan artifact
            inputs:
              targetPath: $(Build.SourcesDirectory)/ci-out
              artifact: terraform-plan

  - stage: Apply
    displayName: Apply or destroy
    dependsOn: Plan
    condition: |
      and(
        succeeded(),
        eq(variables['Build.Reason'], 'Manual'),
        in(variables['terraformActionEffective'], 'apply', 'destroy')
      )
    jobs:
      - deployment: ApplyTerraform
        displayName: terraform ${{ parameters.terraformAction }}
        environment: gcp-poc
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: pipelines/install-terraform.yml
                  parameters:
                    version: $(TF_VERSION)
                - task: DownloadPipelineArtifact@2
                  displayName: Download plan artifact
                  inputs:
                    artifact: terraform-plan
                    path: $(Build.SourcesDirectory)/ci-out
                - script: |
                    set -euo pipefail
                    chmod +x pipelines/run-terraform.sh
                    pipelines/run-terraform.sh "${TERRAFORM_ACTION}"
                  displayName: terraform ${{ parameters.terraformAction }}
                  env:
                    TERRAFORM_ACTION: ${{ parameters.terraformAction }}
                    TF_IN_AUTOMATION: $(TF_IN_AUTOMATION)
                    TF_INPUT: $(TF_INPUT)
                    GOOGLE_CREDENTIALS: $(GCP_SA_JSON)
                    GCP_PROJECT_ID: $(GCP_PROJECT_ID)
                    GCP_BUCKET_NAME: $(GCP_BUCKET_NAME)
                    TF_STATE_BUCKET: $(TF_STATE_BUCKET)
                    TF_STATE_PREFIX: $(TF_STATE_PREFIX)
